[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "v5ai-workflow-python-runner"
version = "0.1.0"
description = "Isolated Python execution control plane for v5ai workflows"
requires-python = ">=3.12,<3.14"
dependencies = [
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
