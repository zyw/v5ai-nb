# V5Ai 前端站点：管理端（/）+ 对话门户（/chat/），API 经 /prod-api/ 转发到后端 v5ai 容器。
# 与 vite dev 代理对称：/prod-api/xxx → 后端 /xxx（对应 .env.production 的 VITE_APP_BASE_API）。

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传附件（对话门户图片上限 5MB/张、3 张/条），留出余量
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- 后端 API ----------
    # proxy_pass 末尾带 /：剥离 /prod-api 前缀后再转发
    location /prod-api/ {
        proxy_pass http://v5ai:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式对话（chat/stream、regenerate）：必须关缓冲、拉长读超时，否则事件会被攒包或断流
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ---------- 对话门户（v5ai-ui-chat，构建时 base=/chat/） ----------
    location /chat/ {
        alias /usr/share/nginx/html/chat/;
        # history 路由刷新回退到门户自己的 index.html
        try_files $uri $uri/ /chat/index.html;
    }
    location = /chat {
        return 301 /chat/;
    }

    # ---------- 管理端（v5ai-ui，部署在根路径） ----------
    location / {
        # history 路由刷新回退
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存（vite 产物文件名含内容 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 容器健康检查探针
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
